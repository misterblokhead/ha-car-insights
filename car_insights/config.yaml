name: Car Insights
version: "0.2.0"
slug: car_insights
url: https://github.com/misterblokhead/ha-car-insights
description: Trips, charging and costs from your car
arch: [amd64, aarch64]
init: false
startup: application
boot: auto
services: ["mqtt:need"]
homeassistant_api: true
map: ["share:rw"]
options:
  default_capacity_kwh: 60
schema:
  default_capacity_kwh: "float(10,200)"
