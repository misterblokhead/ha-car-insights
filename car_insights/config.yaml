name: Car Insights
version: "0.5.3"
slug: car_insights
url: https://github.com/misterblokhead/ha-car-insights
description: Trips, charging and costs from your car
arch: [amd64, aarch64]
init: false
startup: application
boot: auto
services: ["mqtt:need"]
homeassistant_api: true
map: ["share:rw"]
ingress: true
ingress_port: 8099
panel_icon: mdi:car-electric
panel_title: Car Insights
panel_admin: false
options:
  default_capacity_kwh: 60
  sources: []
schema:
  default_capacity_kwh: "float(10,200)"
  sources:
    - vehicle_id: str
      mapping: "list(renault)"
      entity_stem: str
