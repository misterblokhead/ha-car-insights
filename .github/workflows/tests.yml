name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"  # the latest pytest-homeassistant-custom-component needs Python >= 3.14
      - run: pip install -r tests/requirements.txt
      - run: python tests/ha_requirements.py > ha-requirements.txt && pip install -r ha-requirements.txt
      - run: python -m pytest tests

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
